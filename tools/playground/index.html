<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNGine - WebGPU Bytecode Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        .container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .panel {
            background: #16213e;
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            color: #888;
        }

        canvas {
            background: #000;
            border-radius: 4px;
        }

        /* The runtime pins the canvas's rendered box to its authored 512x512
           with inline width/height styles (npm/pngine/src/init-core.js,
           sizeCanvasForInit, the default fixed-size path). Below the width that
           pin needs on this page (512 + 2rem body padding + 1rem panel padding,
           608px, rounded up to 640 for a scrollbar) the box no longer fits and
           the page scrolls sideways. Cap the canvas to its panel and hand the
           height back to the canvas's own 1:1 ratio, so the frame scales
           instead of squashing. At 1280/1400 the pin still fits and this query
           does not apply: the canvas stays 512. */
        @media (max-width: 640px) {
            canvas {
                max-width: 100%;
                height: auto !important;
            }
        }

        /* Independent of the canvas: a long unbroken token in #file-info (a
           133-character filename) or in #status sets the min-content width of
           its flex panel. At a 390px viewport that pushed the page's
           scrollWidth to 621, or 629 when both carried one. The canvas cap
           above cannot cover it because the widening elements are these text
           blocks, not the canvas. overflow-wrap: anywhere only breaks a token
           that cannot otherwise fit, and unlike break-word it also reduces
           min-content sizing; a harness measured scrollWidth back at 390 even
           for a 120-character name, with normal states unchanged. */
        .info,
        .status {
            overflow-wrap: anywhere;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.5rem 1rem;
            background: #0f3460;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875rem;
        }

        button:hover {
            background: #1a4a7a;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.playing {
            background: #e94560;
        }

        .status {
            font-size: 0.75rem;
            padding: 0.5rem;
            border-radius: 4px;
            background: #0f0f23;
        }

        .status.success {
            color: #4ade80;
        }

        .status.error {
            color: #f87171;
        }

        .drop-zone {
            border: 2px dashed #333;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .drop-zone:hover,
        .drop-zone.dragover,
        .drop-zone:focus-visible,
        #file-input:focus-visible + .drop-zone {
            border-color: #0f3460;
        }

        /* Keep the file input in the accessibility tree and reachable, but out
           of the Tab order: the zone is the picker's one keyboard stop.
           display: none took it out of the tree. It sits before the zone so
           the sibling rule above can light the zone up if the input has
           focus. */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .time {
            font-family: monospace;
            font-size: 0.875rem;
        }

        .info {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.5rem;
        }

        .examples {
            margin-top: 1rem;
        }

        .examples a {
            color: #60a5fa;
            text-decoration: none;
            margin-right: 1rem;
        }

        .examples a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>PNGine - WebGPU Bytecode Engine</h1>

    <div class="container">
        <div class="panel">
            <label for="file-input" id="file-input-label">Drop PNG with embedded bytecode</label>
            <input type="file" id="file-input" accept=".png,.pngb" class="visually-hidden" tabindex="-1">
            <div class="drop-zone" id="drop-zone" role="button" tabindex="0" aria-labelledby="file-input-label">
                <p>Drop .png file here</p>
                <p style="font-size: 0.75rem; color: #666; margin-top: 0.5rem;">or click to browse</p>
            </div>
            <div id="file-info" class="info"></div>
            <div class="examples">
                <span style="color: #666; font-size: 0.75rem;">Examples: </span>
                <a href="#" data-url="simple_triangle.png">Triangle</a>
                <a href="#" data-url="moving_triangle.png">Moving</a>
                <a href="#" data-url="rotating_cube.png">Cube</a>
                <a href="#" data-url="boids.png">Boids</a>
            </div>
            <div class="examples" style="margin-top: 0.5rem;">
                <span style="color: #666; font-size: 0.75rem;">Physics (preview): </span>
                <a href="#" data-url="domino_cascade.png">Domino Cascade</a>
                <a href="#" data-url="tower_explosion.png">Tower Explosion</a>
                <a href="#" data-url="circle_avalanche.png">Circle Avalanche</a>
            </div>
        </div>

        <div class="panel">
            <label>Output (512x512)</label>
            <canvas id="canvas" width="512" height="512" role="img" aria-label="Rendered output (512x512)"></canvas>
            <div class="controls">
                <button id="play-btn" disabled>Play</button>
                <button id="stop-btn" disabled>Stop</button>
                <span class="time" id="time">t = 0.00s</span>
            </div>
            <div id="status" class="status">Initializing...</div>
        </div>
    </div>

    <script type="module">
        import { pngine, play, pause, stop, draw, extractBytecode, isPng, isPngb } from './pngine.js';
        // Audio is main-thread state beside the worker (not part of the worker's
        // load protocol), so a reused engine has to be handed the reloaded
        // payload's player explicitly. Both are the same modules pngine() uses.
        import { extractAudio } from './extract.js';
        import { createAudioPlayer } from './audio.js';

        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const timeEl = document.getElementById('time');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');

        let engine = null;

        function setStatus(msg, type = '') {
            status.textContent = msg;
            status.className = 'status' + (type ? ' ' + type : '');
        }

        function formatBytes(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        // Replace the bytecode of a live engine's worker through the worker's own
        // `load` protocol (MSG.LOAD, worker-core.js handleLoad): the same worker
        // keeps the same canvas, its WebGPU device and its configured canvas
        // context across loads. This is the point of the reuse. destroy() would
        // instead terminate a worker owning those objects on every load, which is
        // the teardown a WebKit tab does not survive.
        function reload(worker, bytecode) {
            return new Promise((resolve, reject) => {
                // Mirrors awaitWorkerReady's init timeout: a wedged worker
                // rejects instead of leaving the page at "Loading...".
                const timer = setTimeout(() => settle(new Error('Worker load timeout')), 15000);
                function onMessage(e) {
                    if (e.data?.type === 'ready') settle(null, e.data);
                    else if (e.data?.type === 'error') settle(new Error(e.data.message));
                }
                function onError(e) {
                    settle(new Error(e.message || 'Worker error'));
                }
                function settle(err, result) {
                    clearTimeout(timer);
                    worker.removeEventListener('message', onMessage);
                    worker.removeEventListener('error', onError);
                    if (err) reject(err); else resolve(result);
                }
                // The library's router stays on `worker.onmessage` and still
                // reports errors through options.onError; these listeners only
                // observe the same events to settle this promise.
                worker.addEventListener('message', onMessage);
                worker.addEventListener('error', onError);
                worker.postMessage({ type: 'load', bytecode });
            });
        }

        // Initialize
        async function init() {
            try {
                if (!canvas.transferControlToOffscreen) {
                    throw new Error('OffscreenCanvas not supported');
                }
                setStatus('Ready - drop a PNG file to start', 'success');
            } catch (err) {
                setStatus('Error: ' + err.message, 'error');
            }
        }

        // Load file
        async function loadFile(file) {
            try {
                setStatus('Loading...');

                const data = new Uint8Array(await file.arrayBuffer());
                fileInfo.textContent = `${file.name} (${formatBytes(data.length)})`;

                if (engine) {
                    // Decode both chunks on the main thread first, so a payload
                    // that cannot be loaded leaves the running engine alone.
                    const bytecode = await extractBytecode(data);
                    const audioWasm = await extractAudio(data);

                    // One worker and one canvas for the page's whole life. The
                    // engine's clock is stopped (it may be mid-play) and its
                    // old audio player is released before the worker swaps the
                    // old payload's resources for the new bytecode in place,
                    // without a terminate.
                    stop(engine);
                    engine._.audio?.destroy();
                    engine._.audio = null;
                    playBtn.textContent = 'Play';
                    playBtn.classList.remove('playing');
                    timeEl.textContent = 't = 0.00s';

                    const ready = await reload(engine._.worker, bytecode);
                    engine._.frameCount = ready.frameCount;

                    // The audio player lives on the main thread beside the
                    // worker, so the reload attaches the new payload's player
                    // by hand. A Play landing while the reload was in flight
                    // starts the song at the clock it started.
                    if (audioWasm) {
                        engine._.audio = await createAudioPlayer(audioWasm);
                        if (engine.isPlaying) engine._.audio.play(engine.time);
                    }
                } else {
                    engine = await pngine(data, {
                        canvas: canvas,
                        debug: true,
                        onError: (err) => setStatus('Error: ' + err.message, 'error'),
                    });
                }

                setStatus(`Loaded: ${engine.width}x${engine.height}, ${engine.frameCount} frames`, 'success');
                playBtn.disabled = false;
                stopBtn.disabled = false;

                // Draw first frame
                draw(engine, { time: 0 });

            } catch (err) {
                setStatus('Error: ' + err.message, 'error');
                console.error(err);
            }
        }

        // Load from URL
        async function loadUrl(url) {
            try {
                setStatus('Fetching ' + url + '...');
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('Fetch failed: ' + resp.status);
                const blob = await resp.blob();
                const file = new File([blob], url.split('/').pop(), { type: 'image/png' });
                await loadFile(file);
            } catch (err) {
                setStatus('Error: ' + err.message, 'error');
                console.error(err);
            }
        }

        // Play/pause toggle. One time-display rAF chain at a time: pausing
        // cancels the pending callback and playing starts a chain only if none
        // is pending — a pause→play inside one frame used to leave the old
        // chain alive (it saw isPlaying true again) beside the new one, one
        // extra self-perpetuating chain per same-frame toggle.
        let timeRaf = 0;
        function togglePlay() {
            if (!engine) return;

            if (engine.isPlaying) {
                pause(engine);
                cancelAnimationFrame(timeRaf);
                timeRaf = 0;
                playBtn.textContent = 'Play';
                playBtn.classList.remove('playing');
            } else {
                play(engine);
                playBtn.textContent = 'Pause';
                playBtn.classList.add('playing');
                if (!timeRaf) updateTime();
            }
        }

        // Stop
        function handleStop() {
            if (!engine) return;
            stop(engine);
            playBtn.textContent = 'Play';
            playBtn.classList.remove('playing');
            timeEl.textContent = 't = 0.00s';
        }

        // Update time display
        function updateTime() {
            if (!engine || !engine.isPlaying) { timeRaf = 0; return; }
            timeEl.textContent = `t = ${engine.time.toFixed(2)}s`;
            timeRaf = requestAnimationFrame(updateTime);
        }

        // Event listeners
        playBtn.onclick = togglePlay;
        stopBtn.onclick = handleStop;

        // File drop handling. The zone is a button: Enter and Space do what a
        // click does, and the input stays in the tree for assistive technology.
        dropZone.onclick = () => fileInput.click();
        dropZone.onkeydown = (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                fileInput.click();
            }
        };
        fileInput.onchange = (e) => {
            if (e.target.files[0]) loadFile(e.target.files[0]);
        };

        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        };
        dropZone.ondragleave = () => dropZone.classList.remove('dragover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
        };

        // Example links
        document.querySelectorAll('.examples a').forEach(a => {
            a.onclick = (e) => {
                e.preventDefault();
                loadUrl(a.dataset.url);
            };
        });

        init();
    </script>
</body>

</html>
